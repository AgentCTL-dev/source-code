# e2e mock model provider (OpenAI chat/completions shape).
#
# Same role as deploy/examples/mock-provider.yaml — the agent dials it DIRECTLY
# and presents the pool credential, so it REQUIRES an Authorization header (a
# request with no credential 401s) and reports token usage — but it answers in the
# **OpenAI `chat/completions`** envelope (`choices[].message` + `usage`). That
# matters for the intelligence scenarios driven by the REAL agentd: agentd dials
# its `INTELLIGENCE` endpoint as an OpenAI-compatible provider (it POSTs
# `/v1/chat/completions` and parses `choices[0].message`), so a bare
# `{content,usage}` body (the deploy/examples mock) makes agentd's run fail to
# parse a result. This shape lets a once-mode agentd COMPLETE (exit 0) while still
# carrying `usage.total_tokens` in the response. Dev/test only. Served on the same
# Service name/namespace as the example mock so e2e/manifests/modelpool-mock.yaml
# (endpoint http://mock-provider.default:8080) binds it unchanged.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-provider
  namespace: default
  labels:
    app.kubernetes.io/name: mock-provider
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mock-provider
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mock-provider
    spec:
      containers:
        - name: provider
          image: python:3.12-alpine
          command:
            - python3
            - -c
            - |
              from http.server import BaseHTTPRequestHandler, HTTPServer
              import json
              class H(BaseHTTPRequestHandler):
                  # HTTP/1.1 + Content-Length so a rustls client reads the full
                  # body and never hits the unclean-EOF close (python's ssl
                  # close sends no close_notify, which rustls reports when it
                  # reads to EOF: "peer closed connection without close_notify").
                  protocol_version = 'HTTP/1.1'
                  def do_POST(self):
                      auth = self.headers.get('authorization')
                      n = int(self.headers.get('content-length', 0))
                      body = self.rfile.read(n)
                      if not auth:
                          print('PROVIDER 401 - no credential injected', flush=True)
                          body401 = b'{"error":"missing credential"}'
                          self.send_response(401); self.send_header('content-type','application/json')
                          self.send_header('content-length', str(len(body401))); self.end_headers()
                          self.wfile.write(body401); return
                      try: req = json.loads(body or b'{}')
                      except Exception: req = {}
                      model = req.get('model') or 'mock-model-v1'
                      user = ''
                      for m in req.get('messages', []):
                          if m.get('role') == 'user':
                              c = m.get('content', '')
                              user = c if isinstance(c, str) else json.dumps(c)
                      # OpenAI chat/completions envelope so a real agent (agentd)
                      # parses a final assistant message and COMPLETES; usage is
                      # kept so the response carries token counts (100 tok/call).
                      resp = {
                          "id": "mock-cmpl-1",
                          "object": "chat.completion",
                          "model": model,
                          "choices": [{
                              "index": 0,
                              "message": {"role": "assistant", "content": "mock completion for: " + user},
                              "finish_reason": "stop",
                          }],
                          "usage": {"prompt_tokens": 90, "completion_tokens": 10, "total_tokens": 100},
                      }
                      print('PROVIDER 200 auth=' + auth[:18] + ' model=' + model, flush=True)
                      out = json.dumps(resp).encode()
                      self.send_response(200); self.send_header('content-type','application/json')
                      self.send_header('content-length', str(len(out))); self.end_headers(); self.wfile.write(out)
                  def log_message(self, *a): pass
              import ssl
              ctx = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
              ctx.load_cert_chain('/tls/tls.crt', '/tls/tls.key')
              srv = HTTPServer(('', 8443), H)
              srv.socket = ctx.wrap_socket(srv.socket, server_side=True)
              print('mock-provider (openai shape) listening on :8443 (tls)', flush=True)
              srv.serve_forever()
          volumeMounts:
            - { name: tls, mountPath: /tls, readOnly: true }
          ports:
            - { containerPort: 8443, name: https }
      volumes:
        - name: tls
          secret:
            secretName: mock-provider-tls
---
apiVersion: v1
kind: Service
metadata:
  name: mock-provider
  namespace: default
  labels:
    app.kubernetes.io/name: mock-provider
spec:
  selector:
    app.kubernetes.io/name: mock-provider
  ports:
    - { port: 8443, targetPort: 8443, name: https }
---
# Serving cert from the chart CA so a REAL agent (security.tls_ca = the
# agentctl-ca bundle) verifies the provider hop — agentd refuses plaintext
# non-loopback intelligence endpoints, so the mock must speak https.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mock-provider-tls
  namespace: default
spec:
  secretName: mock-provider-tls
  issuerRef: { name: agentctl-ca, kind: ClusterIssuer }
  dnsNames:
    - mock-provider.default
    - mock-provider.default.svc
    - mock-provider.default.svc.cluster.local
  usages: ["server auth"]
