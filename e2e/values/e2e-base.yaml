# Base values for the e2e suite. Layered UNDER every security overlay; turns on
# the planes the functional + benchmark scenarios drive, while leaving every
# security gate at its secure default (each overlay flips exactly one).
#
# image.registry is intentionally NOT set here — install.sh passes it (default ""
# = local kind-loaded names: agentctl/<comp>:dev). The 6 control-plane images are
# loaded by images.sh.

# Claim-mode coordination server (work.* over HTTP/MCP). Needed by the
# coordination-throughput bench, the claim scenarios, and KEDA scale-from-zero.
coordination:
  enabled: true
  store: memory                 # overlay store-postgres.yaml flips this
  # The claim-fabric scenarios drive work.* DIRECTLY over a port-forward (no
  # pod behind the source IP), so base runs with attestation off; the
  # sec-coord-attest overlay flips it back on and asserts the rejection.
  attestIdentity: false

# Intelligence plane (direct-dial, contract 1.0): there is NO in-cluster broker.
# The operator resolves an Agent's bound model.pool (a ModelPool) and renders
# INTELLIGENCE=<the pool's provider endpoint> that the agent dials DIRECTLY —
# secret-free via AAuth, or with an optional INTELLIGENCE_TOKEN key mounted on the
# pod. No metering, no budgets. The once-mode scenarios (prov-once / conf-exit-codes)
# ride this path because agentd once-mode REQUIRES an intelligence endpoint. Nothing
# to enable here — the operator wires it from the bound ModelPool.
#
# Tools plane (direct-dial, contract 1.0): Agent.spec.mcpServers is an inline list
# of {name, endpoint, auth?, tags} the agent dials DIRECTLY — no separate tool CRD,
# no broker facade. Nothing to enable here either.

# KEDA external scaler — claim-depth autoscaling (0->N->0). Enabling it also
# flips the operator's SCALER_ENABLED so it renders a ScaledObject per claim
# fleet. Requires KEDA in the cluster (up.sh installs it).
scaler:
  enabled: true

# Emit ServiceMonitors so the opt-in PromQL bench lane (up.sh E2E_PROMETHEUS=1,
# which installs kube-prometheus-stack + the monitoring.coreos.com CRDs) scrapes
# every target. NOTE: applying these requires those CRDs present — run the
# install lane with E2E_PROMETHEUS=1 (or pre-install the ServiceMonitor CRD).
metrics:
  serviceMonitor:
    enabled: true

# Platform default agent image (P4): platform-rendered agents (supervisors)
# carry no spec.image — the operator renders them with this. The tag is the
# kind-loaded agentd built by images-quick.sh.
operator:
  defaultAgentImage: "agentd:1.3.1"

# Managed state service (P3): the mcpg-backed checkpointer for
# store.class: managed agents (durability + SIGKILL/restore scenarios).
state:
  enabled: true

# Identity plane (P1): the identity service (federated OIDC + principal
# minting) with durable custody in the bundled Postgres. The api-token Secret
# is rendered for its ADMIN channel (identity + operator minting) without
# arming the coarse data-plane gate (apiToken.enabled stays off here — the
# sec-apitoken overlay owns that gate).
identity:
  service:
    enabled: true
    store: postgres
    # The in-cluster mock issuer (e2e/manifests/mock-idp.yaml) serves from the
    # chart CA; the public cert is copied into this ConfigMap by up.sh (the
    # same shape an admin uses for a corp-CA Keycloak).
    issuerCa: { configMapName: agentctl-issuer-ca, key: ca.crt }
    providers:
      - name: mock
        issuer: https://mock-idp:8443
        client_id: agentctl-cli
