# AAuth overlay (RFC 0028 §5): agentctl-identity IS the Agent Provider. The
# operator's house-provisioning channel points at the identity service and
# authenticates with the shared control-plane admin token; the identity
# service arms its provider role (enroll/agent-token/JWKS surfaces). Layered
# on e2e-base (which already arms identity.service + postgres custody).
identity:
  aauth:
    provider: "http://agentctl-identity.agentctl-system"
    adminTokenSecret:
      name: agentctl-api-token
      key: AGENTCTL_API_TOKEN
  service:
    aauth:
      enabled: true
