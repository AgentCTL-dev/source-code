                              admission (a trifecta leg), never wired by the operator.
                            nullable: true
                            type: boolean
                          exec:
                            description: |-
                              The agent requests in-sandbox command execution. Declared intent; gated at
                              admission (a privileged trifecta leg), never wired by the operator.
                            nullable: true
                            type: boolean
