                          `oidc` configures JWT verification and claim-based authorization for
                          inbound A2A calls. Exposure itself is governed by `surfaces.a2a`.
                        nullable: true
                        properties:
                          grants:
                            description: |-
                              Typed A2A command grants for the named principals (agentd checks a
                              command DataPart's `op` against the caller's grant patterns; natural
                              language needs none). E.g. `mention` for the supervisor's
                              orchestration envelope.
                            items:
                              type: string
                            type: array
                          oidc:
                            description: OIDC/JWT authentication + authorization for inbound A2A calls.
                            nullable: true
                            properties:
                              audiences:
                                description: Accepted `aud` (audience) claims.
                                items:
                                  type: string
                                type: array
                              forwardIdentity:
                                description: Inject the caller's `sub`/`email`/`groups` identity to the agent.
                                nullable: true
                                type: boolean
                              issuer:
                                description: |-
                                  OIDC issuer URL. JWKS is auto-discovered from
                                  `issuer/.well-known/openid-configuration` unless `jwks_uri` is set.
                                type: string
                              jwksUri:
                                description: Explicit JWKS URI override (skips OIDC discovery when set).
                                nullable: true
                                type: string
                              requiredClaims:
                                description: 'Authorization: ALL listed claim requirements must hold for the caller.'
                                items:
                                  description: A single claim-based authorization requirement.
                                  properties:
                                    anyOf:
                                      description: The caller's claim (array contains OR scalar equals) must be one of these.
                                      items:
                                        type: string
                                      type: array
                                    claim:
                                      description: The claim name, e.g. `"groups"` or `"email"`.
                                      type: string
                                  required:
                                  - claim
                                  type: object
                                nullable: true
                                type: array
                            required:
                            - issuer
                            type: object
