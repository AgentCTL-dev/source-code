{{- $ns := include "agentctl.namespace" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentctl-operator
  namespace: {{ $ns }}
  {{- with .Values.operator.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    app.kubernetes.io/name: agentctl-operator
    {{- include "agentctl.labels" . | nindent 4 }}
    {{- with (include "agentctl.commonLabels" $) }}
    {{- . | nindent 4 }}
    {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agentctl-operator
  labels:
    app.kubernetes.io/name: agentctl-operator
    {{- include "agentctl.labels" . | nindent 4 }}
    {{- with (include "agentctl.commonLabels" $) }}
    {{- . | nindent 4 }}
    {{- end }}
rules:
  # `create` on agents: the Supervisor controller renders each Supervisor
  # into an Agent CR (SSA create-or-patch, owner-referenced).
  - apiGroups: ["agentctl.dev"]
    resources: ["agents", "agentfleets"]
    verbs: ["get", "list", "watch", "update", "patch", "create"]
  # Supervisors (RFC 0027): watch + status. The supervisor reconciler also
  # reads the per-namespace `supervisor` AgentClass for its profile
  # (instruction/services/budget) — read-only.
  - apiGroups: ["agentctl.dev"]
    resources: ["supervisors"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["agentctl.dev"]
    resources: ["agentclasses"]
    verbs: ["get", "list", "watch"]
  # Grant resolution (P2-8): the v2 compose path reads `services[]` grants
  # against the namespace's MCPService registry entries.
  - apiGroups: ["agentctl.dev"]
    resources: ["mcpservices"]
    verbs: ["get", "list", "watch"]
  # Tenancy seeding (P4-1): the org controller CREATES the per-namespace
  # platform defaults (control MCPService + supervisor AgentClass) once;
  # 409 = org-owned, never overwritten.
  - apiGroups: ["agentctl.dev"]
    resources: ["mcpservices", "agentclasses"]
    verbs: ["create"]
  - apiGroups: ["agentctl.dev"]
    resources: ["supervisors/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["agentctl.dev"]
    resources: ["agents/status", "agentfleets/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["agentctl.dev"]
    resources: ["agents/finalizers", "agentfleets/finalizers"]
    verbs: ["update"]
  # Tenancy root (RFC 0033 §2.1): the operator reconciles each Organization to
  # its managed namespaces (owner-referenced, so org deletion GC-cascades) and
  # a per-namespace ResourceQuota capping Agent CRs. No delete verbs: teardown
  # rides the ownerReference garbage collector.
  - apiGroups: ["agentctl.dev"]
    resources: ["organizations"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["agentctl.dev"]
    resources: ["organizations/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # RBAC mirror (RFC 0033 §2.1): the operator projects each Organization's
  # accessPolicies as per-namespace Roles + RoleBindings (the kubectl role
  # ladder). `escalate`+`bind` are required by Kubernetes' escalation
  # prevention: the admin mirror role grants `*` on agentctl.dev, which the
  # operator does not hold itself.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "escalate", "bind"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Readiness readback: the /status subresource needs its OWN rule (a rule on
  # the resource does NOT cover it) — without this the fleet readback 403s
  # silently and every fleet reports 0 ready forever (bitten live).
  - apiGroups: ["apps"]
    resources: ["deployments/status", "statefulsets/status"]
    verbs: ["get"]
  # KEDA ScaledObjects for claim-mode AgentFleets. The operator applies
  # these best-effort; a cluster without the KEDA CRDs simply never has them
  # created (the operator gates emission on SCALER_ENABLED and tolerates absence).
  - apiGroups: ["keda.sh"]
    resources: ["scaledobjects"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Workload PKI (contract 1.0): a per-workload serving Certificate is applied
  # into each Agent/Fleet's namespace (same soft-dependency discipline as KEDA),
  # and the cluster-CA PUBLIC cert is distributed as the per-namespace
  # agentctl-ca ConfigMap agent pods mount for client-CA + outbound trust.
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update", "patch"]
  # Tenant mcpg gateways (P5-1): the org controller renders a per-namespace
  # governance proxy — its Service rides this rule (Deployment/ConfigMap are
  # covered above).
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "create", "update", "patch"]
{{- if or .Values.identity.aauth.provider .Values.identity.service.enabled }}
  # Operator-owned Secrets: the per-Agent AAuth Ed25519 key (<name>-aauth-key,
  # RFC 0023, when identity.aauth.provider is set) and/or the per-agent
  # principal bearers (<name>-principals, RFC 0028 §6, when
  # identity.service.enabled). The agent's serving-cert Secrets stay
  # cert-manager-owned. Owner references drive deletion (GC), so no delete verb.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
{{- end }}
{{- if .Values.networkPolicies.enabled }}
  # Tenant isolation: when networkPolicies.enabled, the operator
  # reconciles the per-namespace agent NetworkPolicies (default-deny + sanctioned
  # gateway/DNS egress + control-plane-only ingress) into each Agent/Fleet's OWN
  # namespace, so a dynamically-created tenant namespace is isolated without a
  # chart re-render.
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
{{- end }}
  # Intelligence binding: the operator reads the bound ModelPool to render the
  # agent's direct INTELLIGENCE endpoint (+ mount its key, if any). MCP servers
  # are inline on the Agent now — no cross-object read.
  - apiGroups: ["agentctl.dev"]
    resources: ["modelpools"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # The kube Recorder emits via the modern events.k8s.io/v1 API group.
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Fleet budget windows (P6-6): the operator reads the platform's OWN
  # metering export (the aggregated management API; SAR maps the export to
  # resource `metering`, subresource `export`, verb create).
  - apiGroups: ["management.agentctl.dev"]
    resources: ["metering", "metering/export"]
    verbs: ["get", "create"]
  # Leader election (operator HA): contend for the coordination.k8s.io Lease
  # named "agentctl-operator" so only one replica runs the reconcile loop.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update", "patch", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agentctl-operator
  labels:
    app.kubernetes.io/name: agentctl-operator
    {{- include "agentctl.labels" . | nindent 4 }}
    {{- with (include "agentctl.commonLabels" $) }}
    {{- . | nindent 4 }}
    {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agentctl-operator
subjects:
  - kind: ServiceAccount
    name: agentctl-operator
    namespace: {{ $ns }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentctl-operator
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: agentctl-operator
    {{- include "agentctl.labels" . | nindent 4 }}
    {{- with (include "agentctl.commonLabels" $) }}
    {{- . | nindent 4 }}
    {{- end }}
spec:
  replicas: {{ .Values.operator.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: agentctl-operator
  template:
    metadata:
      {{- $podAnnotations := merge (deepCopy (.Values.operator.podAnnotations | default dict)) (.Values.commonAnnotations | default dict) }}
      {{- with $podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app.kubernetes.io/name: agentctl-operator
        {{- $podLabels := merge (deepCopy (.Values.operator.podLabels | default dict)) (.Values.commonLabels | default dict) }}
        {{- with $podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: agentctl-operator
      {{- include "agentctl.pullSecrets" . | nindent 6 }}
      {{- with (include "agentctl.scheduling" (dict "root" $ "comp" "operator")) }}
      {{- . | nindent 6 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: {{ include "agentctl.image" (dict "root" $ "component" "operator") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { containerPort: 8080, name: http }       # /healthz, /readyz, /metrics
          env:
            {{- include "agentctl.podEnv" (dict "root" $ "comp" "operator") | nindent 12 }}
            # Downward API: pod name is the leader-election holderIdentity; the
            # namespace scopes the coordination.k8s.io Lease (operator HA).
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # KEDA scaler wiring for claim-mode AgentFleets. The
            # operator renders a ScaledObject per claim fleet when SCALER_ENABLED;
            # SCALER_ADDRESS is the external scaler's gRPC endpoint and
            # COORDINATION_URL the backlog source it reads. Resolution order:
            # operator.scaler.* override -> top-level scaler block -> in-cluster
            # Service DNS / the scaler component toggle. Default OFF (scaler block
            # disabled) so a stock install emits no KEDA objects.
            {{- $scaler := .Values.scaler | default dict }}
            {{- $opScaler := .Values.operator.scaler | default dict }}
            {{- $scalerEnabled := ($scaler.enabled | default false) }}
            {{- if hasKey $opScaler "enabled" }}{{- $scalerEnabled = $opScaler.enabled }}{{- end }}
            - name: SCALER_ENABLED
              value: {{ $scalerEnabled | quote }}
            - name: SCALER_ADDRESS
              value: {{ ($opScaler.address | default $scaler.address | default (printf "agentctl-scaler.%s:9100" $ns)) | quote }}
            # When coordination.mtls.enabled the scaler reads work.stats over the
            # coordination mTLS listener (:8443, https, trailing-dot FQDN), so the
            # rendered ScaledObject's coordinationUrl must point there (the scaler
            # presents its client cert). Else the plaintext :8080 (token) endpoint.
            {{- $coordDefault := printf "http://agentctl-coordination.%s/" $ns }}
            {{- if .Values.coordination.mtls.enabled }}
            {{- $coordDefault = printf "https://agentctl-coordination.%s.svc.cluster.local.:8443/" $ns }}
            {{- end }}
            - name: COORDINATION_URL
              value: {{ ($opScaler.coordinationUrl | default $scaler.coordinationUrl | default $coordDefault) | quote }}
            # In-cluster bearer-token injection (apiToken.enabled). When set, the
            # operator injects the bearer token (valueFrom secretKeyRef on the
            # agentctl-api-token Secret) into rendered agent pods so a conformant
            # agent can present it to the coordination server. A
            # secretKeyRef cannot cross namespaces, so the operator only injects
            # for agents IN the control-plane namespace (it reads POD_NAMESPACE
            # above); agents elsewhere need the Secret replicated. Default off ->
            # no injection (unchanged). No extra RBAC: the kubelet resolves the
            # secretKeyRef at pod start, not the operator.
            - name: API_TOKEN_ENABLED
              value: {{ .Values.apiToken.enabled | default false | quote }}
{{- if .Values.identity.service.enabled }}
            # Per-user A2A principal minting (RFC 0028 §6): the operator mints
            # bearers for `spec.access.principals` subjects via the identity
            # service and projects them into `<agent>-principals` Secrets. The
            # mint surface is admin-gated, so the shared control-plane token
            # rides along (the api-token Secret is rendered whenever
            # identity.service.enabled, independent of the coarse gate).
            - name: AGENTCTL_IDENTITY_URL
              value: http://agentctl-identity.{{ include "agentctl.namespace" . }}
            - name: AGENTCTL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agentctl-api-token
                  key: AGENTCTL_API_TOKEN
{{- end }}
            # Tenant network isolation: when on, the operator reconciles
            # the per-namespace agent NetworkPolicies into each Agent/Fleet's own
            # namespace (scoped to the control-plane namespace read from
            # POD_NAMESPACE above). Off -> no reconciliation (unchanged); the
            # chart's static agentNamespaces set still applies where listed.
            - name: NETWORK_POLICIES_ENABLED
              value: {{ .Values.networkPolicies.enabled | default false | quote }}
            # Workload PKI + keyless intelligence wiring (contract 1.0). The
            # operator issues a per-workload serving Certificate (issuerRef
            # below), distributes the CA public cert per namespace (read from
            # its own mount). INTELLIGENCE is rendered directly from the bound
            # ModelPool (see the modelpools RBAC above); the agent dials the
            # provider keyless over https.
            {{- if .Values.certManager.enabled }}
            - name: AGENTCTL_ISSUER_REF
              value: {{ include "agentctl.issuerRefEnv" . | quote }}
            - name: AGENTCTL_CA_FILE
              value: /etc/agentctl/ca/ca.crt
            {{- end }}
            {{- with .Values.operator.defaultAgentImage }}
            # Default agent image: rendered into an Agent/AgentFleet pod when the
            # template omits spec.image. A per-resource spec.image always overrides.
            - name: AGENTCTL_DEFAULT_AGENT_IMAGE
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.gateway.enabled }}
            # The A2A gateway base URL a coordinator's `--a2a-peer worker=…` is
            # rendered against for `distribution: a2a`. Unused for the default
            # `queue` distribution.
            - name: AGENTCTL_GATEWAY_URL
              value: {{ .Values.operator.gatewayUrl | default (printf "http://agentctl-gateway.%s.svc.cluster.local.:8080" $ns) | quote }}
            {{- end }}
            {{- if .Values.state.enabled }}
            # Managed state service (P3): the checkpointer endpoint rendered as
            # the synthetic `state` MCP binding for `store.class: managed`
            # agents (trailing-dot FQDN — dodges search-domain capture).
            - name: AGENTCTL_STATE_URL
              value: {{ printf "http://agentctl-state.%s.svc.cluster.local.:8787/mcp" $ns | quote }}
            {{- end }}
            {{- if .Values.tenantMcpg.enabled }}
            # Tenant capability plane (P5-1): the blessed mcpg image every
            # managed org namespace gets its governance proxy from.
            - name: AGENTCTL_TENANT_MCPG_IMAGE
              value: {{ .Values.tenantMcpg.image | quote }}
            {{- with .Values.tenantMcpg.exchangePlugin }}
            # P5-3: the credential-exchange plugin the tenant gateways load
            # for `auth.mode: obo` registry entries.
            - name: AGENTCTL_MCPG_EXCHANGE_PLUGIN
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.tenantMcpg.nonProductionLicense }}
            - name: AGENTCTL_MCPG_NON_PRODUCTION
              value: "true"
            {{- end }}
            {{- end }}
            {{- if .Values.operator.supervisorIdleParkSeconds }}
            # Supervisor scale-to-zero (P7-6): park after this many idle
            # seconds; the gateway's next touch wakes it. 0/unset = never.
            - name: AGENTCTL_SUPERVISOR_IDLE_PARK
              value: {{ .Values.operator.supervisorIdleParkSeconds | quote }}
            {{- end }}
            {{- if .Values.control.enabled }}
            # Control MCP (P4-1): the endpoint seeded as the per-namespace
            # `control` MCPService (org tenancy controller, create-if-absent).
            - name: AGENTCTL_CONTROL_URL
              value: {{ printf "https://agentctl-control.%s.svc.cluster.local:8443/mcp" $ns | quote }}
            {{- end }}
            {{- if .Values.identity.aauth.provider }}
            # AAuth house-provisioning (RFC 0023): the default Agent Provider
            # agents enroll at, and the operator-side admin token file for
            # allowlist registration / identity learning / revocation. The
            # token never reaches an agent pod.
            - name: AGENTCTL_AAUTH_PROVIDER
              value: {{ .Values.identity.aauth.provider | quote }}
            {{- if .Values.identity.aauth.adminTokenSecret.name }}
            - name: AGENTCTL_AAUTH_ADMIN_TOKEN_FILE
              value: /etc/agentctl/aauth-admin/{{ .Values.identity.aauth.adminTokenSecret.key }}
            {{- end }}
            {{- end }}
          {{- with .Values.operator.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- $aauthAdmin := and .Values.identity.aauth.provider .Values.identity.aauth.adminTokenSecret.name }}
          {{- if or .Values.certManager.enabled $aauthAdmin }}
          volumeMounts:
            {{- if .Values.certManager.enabled }}
            # The cluster CA PUBLIC cert (every chart leaf Secret carries
            # ca.crt; the client-tls leaf always exists). Source of the
            # per-namespace agentctl-ca ConfigMap the operator distributes.
            - name: agentctl-ca
              mountPath: /etc/agentctl/ca
              readOnly: true
            {{- end }}
            {{- if $aauthAdmin }}
            # The Agent Provider admin bearer token (operator-side only).
            - name: aauth-admin-token
              mountPath: /etc/agentctl/aauth-admin
              readOnly: true
            {{- end }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Liveness: the process is up (served by every replica, leader or
          # standby). Readiness: 200 only once this replica holds leadership AND
          # the manager is running — so the Service routes to the active leader.
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: {{ .Values.operator.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.operator.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: {{ .Values.operator.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.operator.probes.readiness.periodSeconds }}
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
      {{- $aauthAdminVol := and .Values.identity.aauth.provider .Values.identity.aauth.adminTokenSecret.name }}
      {{- if or .Values.certManager.enabled $aauthAdminVol }}
      volumes:
        {{- if .Values.certManager.enabled }}
        # ca.crt only — the operator holds the CA PUBLIC half, never its key.
        - name: agentctl-ca
          secret:
            secretName: agentctl-client-tls
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
        {{- if $aauthAdminVol }}
        - name: aauth-admin-token
          secret:
            secretName: {{ .Values.identity.aauth.adminTokenSecret.name }}
        {{- end }}
      {{- end }}
---
# Metrics Service for the operator. Selects every operator replica and
# exposes the http port so the operator ServiceMonitor can scrape /metrics.
# publishNotReadyAddresses: scrape standbys too (which report /readyz 503) so the
# leader gauge is observable across all replicas — exactly one should read 1.
apiVersion: v1
kind: Service
metadata:
  name: agentctl-operator
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: agentctl-operator
    {{- include "agentctl.labels" . | nindent 4 }}
    {{- with (include "agentctl.commonLabels" $) }}
    {{- . | nindent 4 }}
    {{- end }}
spec:
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: agentctl-operator
  ports:
    - { port: 8080, targetPort: http, name: http }
# NOTE: the operator's PodDisruptionBudget now lives in templates/pdb.yaml
# alongside the other components' PDBs (rendered when operator.pdb.enabled).
