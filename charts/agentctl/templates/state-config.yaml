{{- if .Values.state.enabled }}
{{- $ns := include "agentctl.namespace" . }}
{{- $st := .Values.state }}
# Managed state service (P3, RFC 0031 §2): the durable checkpointer agents
# with `store.class: managed` dial. An mcpg gateway (blessed digest-pinned
# image) serving the agentd store-over-MCP "checkpointer profile"
# (contract/schemas/store.profile.json) from SQL bindings over the chart
# Postgres — four tools, zero mapping config on the agent side:
#
#   state.put    seq-CAS write ({ok, latest}; latest non-null = conflict)
#   state.get    read (structuredContent null = absent, never an error)
#   state.list   prefix scan → {keys: [{key, seq}]}
#   state.delete idempotent delete
#
# TENANCY (interim): the store.profile tenancy rule wants the permissible key
# prefix derived from the VERIFIED caller identity. The re-blessed protocol-1
# plugin (2026-08-30, digest 908687fe…, mcpg #659) DOES expose `identity.*`
# in param_exprs now — but mcpg-verified identity means a jwks-verified
# BEARER on the store dial, and agentd's store-over-MCP dial carries none
# today. Until per-agent store bearers are minted (identity JWKS →
# governance.access.jwks here, then param_exprs fencing + trust `verified`),
# the fence stays prefix-trust: the OPERATOR renders each agent's
# `store.prefix` (orgs/<ns>/<name>) into config the agent cannot edit, and
# NetworkPolicy admits only agent namespaces. Every call is audited
# (fail-closed local-file sink).
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentctl-state-config
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: agentctl-state
    {{- include "agentctl.labels" . | nindent 4 }}
data:
  config.yaml: |
    gateway:
      server:
        bind_address: "0.0.0.0:8787"
        mcp_path: "/mcp"
        health_path: "/health"
        max_request_body_mb: 4
        # TLS termination on the same listener (P3): agentd refuses to dial a
        # plaintext MCP endpoint off-loopback, so the state gateway serves
        # HTTPS with the chart-CA cert the managed agent already trusts. The
        # `tls:` block's presence flips this HTTP transport to HTTPS (mcpg
        # beta.26, deny_unknown_fields — these are the complete legal keys).
        tls:
          cert_path: /etc/mcpg/tls/tls.crt
          key_path: /etc/mcpg/tls/tls.key
          min_tls_version: "1.2"
        # Interim prefix-trust posture (see header): the caller self-asserts
        # its identity via x-mcpg-subject-id behind the NetworkPolicy
        # perimeter, raising it to header_asserted — the tier the state
        # bindings require. Rises to `verified` when the identity-fenced
        # plugin pin (param_exprs identity.*) lands with P3-2.
        trust_subject_header: true
        # The per-IP anonymous limiter (default 600/min + 100 burst) throttles
        # ALL below-verified callers — including a real header-asserted managed
        # agent under sustained checkpoint load, which would otherwise stall at
        # 10 writes/s. That limiter defends an internet-facing gateway against
        # unattributable abuse; the state service is internal — reachable only
        # by netpol-admitted agent pods, and every row is fenced to the
        # caller's own subject prefix (param_exprs, below). Both real controls
        # sit elsewhere, so the redundant per-IP limiter is off here.
        anonymous_rate_limit_per_min: 0
      plugin_registry:
        # OCI plugin cache on the pod's writable emptyDir (root fs is RO).
        cache_dir: /var/cache/mcpg

    governance:
      policy:
        tool_access:
          # Interim prefix-trust posture (see header). Raise to `verified`
          # when the identity-fenced plugin pin lands.
          default_minimum_trust: unauthenticated
      audit:
        enabled: true
        required: true
        on_failure: fail_closed
        sinks:
          - kind: dev.mcpg.builtin.audit.local-file
            config:
              path: /var/log/mcpg/audit.log

    plugins:
      - id: dev.mcpg.backend.sql
        class: backend
        source: { oci: "{{ $st.pluginImage }}" }
        granted_capabilities: ["network_outbound"]

    mcp:
      capabilities:
        tools:
          - name: state.put
            title: "Checkpoint write (seq CAS)"
            description: >-
              Compare-and-set one state envelope: accepted iff the stored seq
              for the key is exactly seq-1 (or seq=1 into an absent key).
              Replays of an accepted write (same seq, identical state) stay
              accepted — the fence trips only on a REAL divergence, which is
              split-brain and must surface as {latest}.
            annotations: { read_only: false, idempotent: true, destructive: false, open_world: false }
            input_schema:
              type: object
              required: [key, seq, state]
              properties:
                key: { type: string, minLength: 1, maxLength: 1024 }
                seq: { type: integer, minimum: 1 }
                state: { type: object, description: "The agentd state envelope." }
                # MCP reserves `_meta` on tool arguments (agentd sends it); allow it.
                _meta: { type: object }
              additionalProperties: false
            backend:
              kind: sql
              driver: postgres
              url: "${env.DATABASE_URL}"
              query:
                # One statement, one row out: {ok, latest}. `cur` snapshots the
                # stored row; `attempt` performs the guarded CAS (insert only
                # valid firsts, update only exact successors); `idem` accepts a
                # byte-identical replay of the already-stored seq (agentd's
                # _meta idempotency key does not reach SQL bindings, so the
                # binding self-idempotates). Conflict returns the stored seq —
                # COALESCE 0 when the key is absent but seq>1 (still a CAS
                # refusal, never an insert).
                sql: |
                  WITH cur AS (
                    SELECT seq, state FROM agent_state
                    WHERE key = :key AND starts_with(:key, :caller || '/')
                  ), attempt AS (
                    INSERT INTO agent_state (key, seq, state, updated_at)
                    SELECT :key, :seq, CAST(:state AS jsonb), now()
                    WHERE starts_with(:key, :caller || '/')
                      AND (:seq = 1 OR EXISTS (SELECT 1 FROM cur WHERE cur.seq = :seq - 1))
                    ON CONFLICT (key) DO UPDATE
                      SET seq = EXCLUDED.seq, state = EXCLUDED.state, updated_at = now()
                      WHERE agent_state.seq = EXCLUDED.seq - 1
                    RETURNING seq
                  ), idem AS (
                    SELECT 1 AS hit FROM cur
                    WHERE cur.seq = :seq AND cur.state = CAST(:state AS jsonb)
                  )
                  SELECT
                    (EXISTS (SELECT 1 FROM attempt) OR EXISTS (SELECT 1 FROM idem)) AS ok,
                    CASE
                      WHEN EXISTS (SELECT 1 FROM attempt) OR EXISTS (SELECT 1 FROM idem)
                        THEN NULL
                      ELSE COALESCE((SELECT cur.seq FROM cur), 0)
                    END AS latest
                # The TENANT FENCE (P3-2): identity.subject_id (the caller's own
                # asserted subject, host-supplied — the args map can never set
                # it) is bound into the query, so every row the caller can
                # touch must be under its OWN subject prefix. A conforming
                # agent's keys are `<subject>/…`; a call passing another
                # agent's key matches nothing. Header-asserted tier today
                # (perimeter-compensated); a pure tier swap to verified JWT.
                param_exprs:
                  caller: "identity.subject_id"
                params: [key, seq, state, caller]
                row_mode: single
                timeout_ms: 5000

          - name: state.get
            title: "Checkpoint read"
            description: >-
              Fetch the state envelope for a key (optionally pinned to an
              exact seq). Absent keys return null, never an error.
            annotations: { read_only: true, idempotent: true, open_world: false }
            input_schema:
              type: object
              required: [key]
              properties:
                key: { type: string, minLength: 1, maxLength: 1024 }
                seq: { type: integer, minimum: 1 }
                # MCP reserves `_meta` on tool arguments (agentd sends it); allow it.
                _meta: { type: object }
              additionalProperties: false
            backend:
              kind: sql
              driver: postgres
              url: "${env.DATABASE_URL}"
              query:
                sql: |
                  SELECT state, seq FROM agent_state
                  WHERE key = :key
                    AND starts_with(:key, :caller || '/')
                    AND (CAST(:seq AS bigint) IS NULL OR seq = CAST(:seq AS bigint))
                params: [key, seq, caller]
                param_exprs:
                  # `seq` is optional on the wire; SQL params are not — bind
                  # SQL NULL when absent (and the cast keeps NULL bigint-typed).
                  seq: "has(arguments.seq) ? arguments.seq : null"
                  # The tenant fence (P3-2): the caller's own subject.
                  caller: "identity.subject_id"
                row_mode: single
                read_only: true
                timeout_ms: 5000

          - name: state.list
            title: "Checkpoint key scan"
            description: "List {key, seq} under a key prefix, ordered by key."
            annotations: { read_only: true, idempotent: true, open_world: false }
            input_schema:
              type: object
              required: [prefix]
              properties:
                prefix: { type: string, minLength: 1, maxLength: 1024 }
                # MCP reserves `_meta` on tool arguments (agentd sends it); allow it.
                _meta: { type: object }
              additionalProperties: false
            backend:
              kind: sql
              driver: postgres
              url: "${env.DATABASE_URL}"
              query:
                sql: |
                  SELECT COALESCE(
                           jsonb_agg(jsonb_build_object('key', key, 'seq', seq) ORDER BY key),
                           '[]'::jsonb
                         ) AS keys
                  FROM agent_state
                  WHERE starts_with(key, :prefix)
                    AND starts_with(key, :caller || '/')
                params: [prefix, caller]
                param_exprs:
                  # The tenant fence (P3-2): listed keys are always the
                  # caller's, whatever prefix it asks for.
                  caller: "identity.subject_id"
                row_mode: single
                read_only: true
                timeout_ms: 5000

          - name: state.delete
            title: "Checkpoint delete"
            description: "Delete one key. Idempotent; deleting an absent key succeeds."
            annotations: { read_only: false, idempotent: true, destructive: true, open_world: false }
            input_schema:
              type: object
              required: [key]
              properties:
                key: { type: string, minLength: 1, maxLength: 1024 }
                # MCP reserves `_meta` on tool arguments (agentd sends it); allow it.
                _meta: { type: object }
              additionalProperties: false
            backend:
              kind: sql
              driver: postgres
              url: "${env.DATABASE_URL}"
              query:
                sql: "DELETE FROM agent_state WHERE key = :key AND starts_with(:key, :caller || '/')"
                params: [key, caller]
                param_exprs:
                  # The tenant fence (P3-2): a caller can delete only its own keys.
                  caller: "identity.subject_id"
                row_mode: affected_rows
                timeout_ms: 5000

          # --- admin (P3-2): snapshot/restore a per-agent prefix -----------
          - name: state.admin.snapshot
            title: "Prefix snapshot (export, keyset-paginated)"
            description: >-
              Export {key, seq, state} rows under a prefix as one ordered PAGE —
              the durable backup unit for `agentctl backup` and the input to
              state.admin.restore. The whole result rides one mcpg FFI frame
              (256 KiB host cap), so a large prefix MUST be walked: return keys
              strictly after `after`, ordered by key, at most `limit`; `next` is
              the page's last key (null when the page is empty). Pass `next`
              back as `after` to continue; an empty page ends the walk. `limit`
              defaults to 100 — conservative for the ~KiB agentd state envelopes,
              so one page stays under the frame cap (a single envelope must be
              < the cap, which agentd's are). See docs/v2/known-limits.md.
            annotations: { read_only: true, idempotent: true, open_world: false }
            input_schema:
              type: object
              required: [prefix]
              properties:
                prefix: { type: string, minLength: 1, maxLength: 1024 }
                after: { type: string, minLength: 1, maxLength: 1024, description: "Keyset cursor: return keys strictly greater than this." }
                limit: { type: integer, minimum: 1, maximum: 1000 }
                _meta: { type: object }
              additionalProperties: false
            backend:
              kind: sql
              driver: postgres
              url: "${env.DATABASE_URL}"
              query:
                # Keyset page (seek method): `key > :after` beats OFFSET at depth,
                # and `next = max(key)` is the resume cursor. Aggregate the page
                # into one array; the scalar subquery reads the same CTE.
                sql: |
                  WITH page AS (
                    SELECT key, seq, state FROM agent_state
                    WHERE starts_with(key, :prefix)
                      AND (CAST(:after AS text) IS NULL OR key > CAST(:after AS text))
                    ORDER BY key
                    LIMIT :limit
                  )
                  SELECT
                    COALESCE(
                      jsonb_agg(
                        jsonb_build_object('key', key, 'seq', seq, 'state', state)
                        ORDER BY key
                      ),
                      '[]'::jsonb
                    ) AS items,
                    (SELECT max(key) FROM page) AS next
                  FROM page
                params: [prefix, after, limit]
                param_exprs:
                  # after/limit are optional on the wire but SQL params are not —
                  # bind SQL NULL / the default when absent (the state.get seq
                  # pattern; the CAST keeps NULL text-typed for the comparison).
                  after: "has(arguments.after) ? arguments.after : null"
                  limit: "has(arguments.limit) ? arguments.limit : 100"
                row_mode: single
                read_only: true
                timeout_ms: 15000

          - name: state.admin.list
            title: "Prefix key scan (keys-only, keyset-paginated)"
            description: >-
              List {key, seq} (NO state blob) under a prefix as one ordered
              keyset page — the cheap enumeration / existence primitive. Because
              it never pulls `state`, the payload is ~orders of magnitude smaller
              than state.admin.snapshot (a run-cursor key is ~100 B vs a ~KiB
              envelope), so it clears the FFI frame cap for far larger prefixes.
              Same `after` / `limit` / `next` walk as state.admin.snapshot;
              `limit` defaults to 1000. Unfenced admin (explicit prefix) — used
              by the existence check and by `migrate`'s zero-loss seq compare.
            annotations: { read_only: true, idempotent: true, open_world: false }
            input_schema:
              type: object
              required: [prefix]
              properties:
                prefix: { type: string, minLength: 1, maxLength: 1024 }
                after: { type: string, minLength: 1, maxLength: 1024, description: "Keyset cursor: return keys strictly greater than this." }
                limit: { type: integer, minimum: 1, maximum: 10000 }
                _meta: { type: object }
              additionalProperties: false
            backend:
              kind: sql
              driver: postgres
              url: "${env.DATABASE_URL}"
              query:
                sql: |
                  WITH page AS (
                    SELECT key, seq FROM agent_state
                    WHERE starts_with(key, :prefix)
                      AND (CAST(:after AS text) IS NULL OR key > CAST(:after AS text))
                    ORDER BY key
                    LIMIT :limit
                  )
                  SELECT
                    COALESCE(
                      jsonb_agg(jsonb_build_object('key', key, 'seq', seq) ORDER BY key),
                      '[]'::jsonb
                    ) AS items,
                    (SELECT max(key) FROM page) AS next
                  FROM page
                params: [prefix, after, limit]
                param_exprs:
                  after: "has(arguments.after) ? arguments.after : null"
                  limit: "has(arguments.limit) ? arguments.limit : 1000"
                row_mode: single
                read_only: true
                timeout_ms: 15000

          - name: state.admin.read_chunk
            title: "Single-value chunked read"
            description: >-
              Read a slice of ONE key's state text — `substring(state::text FROM
              :offset FOR :length)` (offset 1-based, length in CHARACTERS) plus
              the value's total `len`. This is how a value LARGER than the
              256 KiB FFI frame is read back: stream it across many under-cap
              chunks and concatenate the ordered slices (byte-lossless — verified
              by md5), then parse the whole as JSON. `length` MUST keep one frame
              under the cap; 40000 chars is safe even for 4-byte code points plus
              JSON re-escaping (schema caps it at 60000). `len` is null for an
              absent key. Unfenced admin (docs/v2/known-limits.md).
            annotations: { read_only: true, idempotent: true, open_world: false }
            input_schema:
              type: object
              required: [key, offset, length]
              properties:
                key: { type: string, minLength: 1, maxLength: 1024 }
                offset: { type: integer, minimum: 1 }
                length: { type: integer, minimum: 1, maximum: 60000 }
                _meta: { type: object }
              additionalProperties: false
            backend:
              kind: sql
              driver: postgres
              url: "${env.DATABASE_URL}"
              query:
                # CAST offset/length to int — the plugin binds params as text
                # (same reason state.get casts :seq); substring(text FROM int FOR
                # int) will not resolve against text-typed params otherwise.
                sql: |
                  SELECT substring(state::text FROM CAST(:offset AS int) FOR CAST(:length AS int)) AS chunk,
                         length(state::text) AS len
                  FROM agent_state
                  WHERE key = :key
                params: [key, offset, length]
                row_mode: single
                read_only: true
                timeout_ms: 15000

          - name: state.admin.restore
            title: "Prefix restore (import)"
            description: >-
              Restore a snapshot: UPSERT each {key, seq, state} row from the
              `items` array (last-writer-wins on key). Idempotent — restoring
              the same snapshot twice is a no-op. Returns the row count.
            annotations: { read_only: false, idempotent: true, destructive: false, open_world: false }
            input_schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [key, seq, state]
                    properties:
                      key: { type: string, minLength: 1, maxLength: 1024 }
                      seq: { type: integer, minimum: 1 }
                      state: { type: object }
                    additionalProperties: false
                _meta: { type: object }
              additionalProperties: false
            backend:
              kind: sql
              driver: postgres
              url: "${env.DATABASE_URL}"
              query:
                # Explode the JSON array to rows and UPSERT each. `:items` binds
                # the whole array as jsonb; jsonb_to_recordset projects it.
                sql: |
                  WITH incoming AS (
                    SELECT key, seq, state
                    FROM jsonb_to_recordset(CAST(:items AS jsonb))
                      AS x(key text, seq bigint, state jsonb)
                  ), applied AS (
                    INSERT INTO agent_state (key, seq, state, updated_at)
                    SELECT key, seq, state, now() FROM incoming
                    ON CONFLICT (key) DO UPDATE
                      SET seq = EXCLUDED.seq, state = EXCLUDED.state, updated_at = now()
                    RETURNING 1
                  )
                  SELECT count(*) AS restored FROM applied
                params: [items]
                row_mode: single
                timeout_ms: 30000

          - name: state.admin.purge
            title: "Prefix purge (reset)"
            description: >-
              Delete every row under a prefix — the destructive half of
              `agentctl reset` (a fresh start: the next `state.put seq=1` into a
              purged key is an insert again). Returns the row count. Unfenced
              admin, like snapshot/restore — takes an explicit prefix, so a
              caller may only reach it through the SAR-gated management API.
            annotations: { read_only: false, idempotent: true, destructive: true, open_world: false }
            input_schema:
              type: object
              required: [prefix]
              properties:
                prefix: { type: string, minLength: 1, maxLength: 1024 }
                _meta: { type: object }
              additionalProperties: false
            backend:
              kind: sql
              driver: postgres
              url: "${env.DATABASE_URL}"
              query:
                sql: |
                  DELETE FROM agent_state WHERE starts_with(key, :prefix)
                params: [prefix]
                row_mode: affected_rows
                timeout_ms: 15000
{{- end }}
