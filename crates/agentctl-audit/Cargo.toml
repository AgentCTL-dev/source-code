# SPDX-License-Identifier: Apache-2.0
[package]
name = "agentctl-audit"
version.workspace = true
description = "agentctl audit trail: the versioned audit-record vocabulary (attributed {org, namespace, workload, user} with trail/task correlation), the durable Postgres sink every control-plane component writes, and the filtered query the management API serves. Apache-2.0 — the record shape is a public contract."
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
tracing = "0.1"
# The same pure-Rust PG stack the gateway links (no C toolchain).
deadpool-postgres = "0.14"
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }

# Async runtime for the PG sink (deadpool/tokio-postgres) + the unit tests.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }


[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
