# SPDX-License-Identifier: BUSL-1.1
[package]
name = "agentctl-sandbox"
version = "1.3.0"
description = "agentctl sandbox cell: the sandbox.* MCP backend — code runs in single-use, capability-stripped pods inside a network-denied cell namespace (warm pool for latency; RuntimeClass/Kata optional), with capped artifacts I/O. BUSL-1.1 control plane."
edition.workspace = true
rust-version.workspace = true
license = "BUSL-1.1"
repository.workspace = true

[[bin]]
name = "agentctl-sandbox"
path = "src/main.rs"

[dependencies]
agentctl-telemetry = { path = "../agentctl-telemetry" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "io-util"] }
kube = { version = "4", default-features = false, features = ["client", "rustls-tls", "ws"] }
k8s-openapi = { version = "0.28", features = ["latest"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
tracing = "0.1"
futures = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
