# SPDX-License-Identifier: BUSL-1.1
[package]
name = "agentctl-control"
version = "1.3.0"
description = "agentctl control MCP server: the governed control.* tool surface supervisors manage their estate through. Verifies AAuth-signed agent dials (RFC 9421 jwt scheme against the fleet Agent Provider's JWKS), scopes every tool to the verified caller's own namespace, and drives Agent CRs through the admission-gated Kubernetes API. Rust (axum)."
edition.workspace = true
rust-version.workspace = true
license = "BUSL-1.1"  # control plane — source-available (see LICENSE-BUSL)
repository.workspace = true

[[bin]]
name = "agentctl-control"
path = "src/main.rs"

[dependencies]
axum = "0.8"
# HTTPS serving (the aauth ⇒ https CEL rule holds for every signed dial):
# cert-manager cert mounted, same rustls/ring stack as the rest of the plane.
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }
# Outbound to the Agent Provider (JWKS refresh). No native-tls, no C toolchain.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde_json.workspace = true
tracing = "0.1"
kube = { version = "4", default-features = false, features = ["client", "rustls-tls", "ring"] }
k8s-openapi = { version = "0.28", features = ["latest"] }
# The CRD types (v1alpha2 Agent family) + the AAuth verification rungs the
# identity crate exports (jwt-scheme RFC 9421 verify, agent-token parsing).
agent-api = { path = "../agent-api" }
agentctl-identity = { path = "../agentctl-identity" }
agentctl-telemetry = { path = "../agentctl-telemetry" }
base64 = "0.22"

[dev-dependencies]
ring = "0.17"
