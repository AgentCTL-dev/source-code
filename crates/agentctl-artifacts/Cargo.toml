[package]
name = "agentctl-artifacts"
version = "1.3.0"
description = "agentctl artifacts façade: the artifacts.* MCP backend — put/get/list over an S3-compatible content store (MinIO), org-fenced with per-org byte quotas. BUSL-1.1 control plane."
edition.workspace = true
rust-version.workspace = true
license = "BUSL-1.1"
repository.workspace = true

[[bin]]
name = "agentctl-artifacts"
path = "src/main.rs"

[dependencies]
agentctl-telemetry = { path = "../agentctl-telemetry" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }
# S3 client is HAND-ROLLED on reqwest + SigV4 (sha2/hmac/hex) — the workspace is
# rustls-only and deny-clean, and every off-the-shelf S3 crate drags in an
# OpenSSL/MPL/vulnerable-XML tail. These deps are all already in the tree.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
jiff = "0.2"
percent-encoding = "2"
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
tracing = "0.1"
