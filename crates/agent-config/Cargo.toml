# agent-config — pure composition of the agent config document (ACC 2).
#
# The one place an `Agent`/`AgentFleet` spec becomes the agentd v1.3.x
# `config_version: "1"` document. No I/O, no kube, no HTTP: the operator feeds
# it resolved facts and mounts the result; admission feeds it the same facts and
# runs `agentd --validate-config` over the output. Keeping the builder shared is
# what keeps those two views byte-identical (RFC 0032 §5).
[package]
name = "agent-config"
version = "1.3.0"
edition.workspace = true
rust-version.workspace = true
license = "BUSL-1.1"
repository.workspace = true
description = "Pure agentd config-document composition for the agentctl control plane (ACC 2)"

[dependencies]
agent-api = { path = "../agent-api" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"
